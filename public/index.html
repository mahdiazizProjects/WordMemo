<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WordMemo · Remember the Word</title>
    <meta name="description" content="A quiet Bible memory app. Explore all 66 books, find verses by topic, and practise Scripture with daily flashcards. No account needed." />
    <meta name="theme-color" content="#294C3C" />
    <meta name="application-name" content="WordMemo" />
    <meta name="apple-mobile-web-app-title" content="WordMemo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="WordMemo · Remember the Word" />
    <meta property="og:description" content="Carry Scripture in your heart. The full Bible, topics, and a gentle daily memory practice." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #F6F3EC; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      @supports (height: 100dvh) { #root { height: 100dvh; } }
      :focus-visible { outline: 2px solid #98733C; outline-offset: 3px; }
      noscript { display: block; padding: 32px; font: 18px/1.6 Georgia, serif; color: #233D33; }
    </style>
  </head>
  <body>
    <noscript>WordMemo needs JavaScript to display your Bible and memory cards. Please enable it in your browser settings.</noscript>
    <div id="root"></div>
  </body>
