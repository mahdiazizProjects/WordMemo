customHeaders:
  - pattern: '**'
    headers:
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'no-referrer'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000'
      - key: 'Cache-Control'
        value: 'public, max-age=0, s-maxage=0, must-revalidate'
